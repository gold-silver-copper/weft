[package]
name = "weft-macros"
version = "0.1.0"
edition = "2024"
description = "The declaration macros of weft: #[kind], #[relation], #[component], module! and game!."

[lib]
proc-macro = true

[dependencies]
darling = "0.24"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
